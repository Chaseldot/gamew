name: Deploy Universe Site

on:
  push:
    branches:
      - main
    paths:
      - assets/**
      - canon/**
      - character-production/**
      - showcase/content/**
      - showcase/universe-site/**
      - .github/workflows/deploy-universe-site.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Checkout LFS files
        run: git lfs checkout

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build universe site
        working-directory: showcase/universe-site
        run: npm run build

      - name: Test universe site
        working-directory: showcase/universe-site
        run: npm test

      - name: Disable Jekyll
        run: touch showcase/universe-site/dist/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: showcase/universe-site/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
